<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Nuestra Historia en la CDMX</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Lienzo principal del croquis con soporte táctil panorámico -->
  <div class="map-container">
    
    <!-- Viñeta de título superior izquierda -->
    <div class="map-title-box">
      <h1>Nuestra Historia en la CDMX</h1>
      <p>El plano secreto de nuestros lugares favoritos. Toca cualquier punto para abrir el recuerdo.</p>
    </div>

    <!-- Viñeta de dedicatoria inferior derecha -->
    <div class="map-footer-box">
      <span>Hecho con mucho ❤️ para ti</span>
    </div>

    <!-- Capa interactiva de pines con dimensiones amplias para explorar en móvil -->
    <div id="pins-layer" class="pins-layer"></div>
  </div>

  <!-- Ventana Modal de Recuerdos -->
  <div id="modal" class="modal hidden">
    <div class="modal-content">
      <button id="close-modal" class="close-btn">✕</button>
      <div id="modal-category" class="category-tag"></div>
      <h2 id="modal-title" class="modal-title"></h2>
      <div id="modal-body"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
